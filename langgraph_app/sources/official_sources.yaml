# Official sources registry (ALL parliaments) — STRICT day-only start dates
# Rule: We only set Legislature.start_date when we can extract an explicit YYYY-MM-DD
# from an official parliament source that clearly refers to the constituting session / assembly
# ("Konstituierende Sitzung", "Zusammentritt", "Erste Sitzung").
#
# Fill in URLs per parliament. Keep them stable and, where possible, link to pages that list
# constituting session dates per term (Wahlperiode). If only per-term pages exist, add one
# entry per term (or add a templated URL pattern if your parser supports it).
#
# Evidence policy:
# - For each fetched page, store retrieved_at + sha256(content) in source_meta.
# - Do not estimate dates. If no day is present => keep NULL and store raw + precision.

version: 1
default:
  kind: html
  date_regex_hints:
    - "Konstituierende Sitzung"
    - "Zusammentritt"
    - "Erste Sitzung"
    - "Konstituierung"
  http:
    timeout_seconds: 20
    max_retries: 3
    backoff_seconds: 1.0
    rate_limit_ms: 150

